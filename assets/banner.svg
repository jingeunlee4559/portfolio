<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1022"/>
      <stop offset="0.55" stop-color="#16124A"/>
      <stop offset="1" stop-color="#2A1368"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#2F8CFF" stop-opacity="0.75"/><stop offset="1" stop-color="#2F8CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.75"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#EC4899" stop-opacity="0.45"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>

    <circle cx="170" cy="70" r="230" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;50 30;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="290" r="260" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 -30;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="-30" r="190" fill="url(#orbC)">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 25;0 0" dur="13s" repeatCount="indefinite"/>
    </circle>

    <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  </g>

  <!-- role pill -->
  <rect x="402" y="46" width="396" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.22"/>
  <circle cx="428" cy="64" r="5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="446" y="70" font-size="15" font-weight="700" fill="#E0E7FF" letter-spacing="2.4">FULL-STACK  ·  AI SERVICE DEVELOPER</text>

  <!-- name -->
  <text x="600" y="168" text-anchor="middle" font-size="84" font-weight="800" fill="url(#accent)" letter-spacing="1">Jin Geun Lee</text>
  <text x="600" y="206" text-anchor="middle" font-size="22" font-weight="500" fill="#A5B4FC" letter-spacing="14">이 진 근</text>

  <!-- cycling taglines -->
  <text x="600" y="262" text-anchor="middle" font-size="24" font-weight="500" fill="#C7D2FE" opacity="1">문제를 정의하고, 구조로 해결하는 개발자
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.30;0.333;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="262" text-anchor="middle" font-size="24" font-weight="500" fill="#C7D2FE" opacity="0">화면에서 API, AI 연동까지 끝까지 책임집니다
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.363;0.63;0.666;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="262" text-anchor="middle" font-size="24" font-weight="500" fill="#C7D2FE" opacity="0">전기공학에서 풀스택으로, 계속 성장하는 중입니다
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.696;0.963;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- accent bar -->
  <rect x="540" y="298" width="120" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="580;540;580" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
